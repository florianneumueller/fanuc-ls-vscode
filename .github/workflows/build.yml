name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release mit Tag v<version aus package.json> anlegen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: VSIX paketieren
        run: npx vsce package --out fanuc-ls-${{ github.sha }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: fanuc-ls-vsix
          path: '*.vsix'

      - name: GitHub Release anlegen (Tag v* oder manuell mit release=true)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur package.json-Version $VERSION"
            exit 1
          fi
          mv fanuc-ls-${{ github.sha }}.vsix fanuc-ls-$VERSION.vsix
          gh release create "$TAG" fanuc-ls-$VERSION.vsix --target "$GITHUB_SHA" --title "$TAG" --generate-notes
